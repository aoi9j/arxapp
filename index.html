<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080d">
  <title>ARX · Acceso privado</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 15%, #35122f 0%, transparent 38%),
        radial-gradient(circle at 90% 80%, #111b42 0%, transparent 42%),
        #07070b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .logo {
      font-size: 76px;
      font-weight: 900;
      letter-spacing: 18px;
      margin-left: 18px;
      margin-bottom: 55px;
    }

    .symbol {
      width: 170px;
      height: 170px;
      margin: 0 auto 45px;
      border-radius: 48px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.025);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow:
        0 25px 80px rgba(0,0,0,.4),
        inset 0 0 30px rgba(255,255,255,.025);
    }

    .symbol span {
      font-size: 52px;
      font-weight: 900;
      transform: rotate(-25deg);
    }

    h1 {
      font-size: 42px;
      margin: 0 0 12px;
      font-weight: 800;
    }

    .subtitle {
      color: #aaa5b7;
      font-size: 17px;
      line-height: 1.5;
      margin: 0 auto 38px;
      max-width: 370px;
    }

    .label {
      display: block;
      color: #aaa5b7;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      height: 64px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.045);
      color: white;
      padding: 0 20px;
      font-size: 17px;
      outline: none;
      text-align: center;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #b46cff;
      box-shadow: 0 0 0 3px rgba(180,108,255,.12);
    }

    button {
      width: 100%;
      height: 64px;
      border: 0;
      border-radius: 20px;
      color: white;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(100deg, #ec3ba5, #8060ff);
      box-shadow: 0 12px 35px rgba(170,60,210,.25);
      transition: transform .15s, opacity .15s;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      opacity: .55;
    }

    .message {
      min-height: 25px;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.45;
    }

    .error {
      color: #ff8fae;
    }

    .success {
      color: #8df0c2;
    }

    .code-box {
      display: none;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid rgba(255,255,255,.1);
    }

    .code-box.visible {
      display: block;
    }

    .small {
      color: #8f8a99;
      font-size: 13px;
      margin-top: 20px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 55px;
      color: #6f6a78;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: -4px;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">ARX</div>

  <div class="symbol">
    <span>⌁</span>
  </div>

  <!-- PANTALLA DE ACCESO -->
  <div id="loginScreen">

    <h1>Acceso privado</h1>

    <p class="subtitle">
      Entra con tu email.<br>
      Te enviaremos un enlace seguro para acceder a ARX.
    </p>

    <label class="label" for="email">
      TU EMAIL
    </label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="tu@email.com"
      inputmode="email"
    >

    <button id="sendButton" type="button">
      Enviarme el enlace
    </button>

    <div id="message" class="message"></div>

    <div class="code-box" id="codeBox">

      <label class="label" for="memberCode">
        CÓDIGO ARX
      </label>

      <input
        id="memberCode"
        type="text"
        placeholder="ARX-MEMBER-1702"
        autocomplete="off"
      >

      <button id="codeButton" type="button">
        Entrar en ARX
      </button>

      <div id="codeMessage" class="message"></div>

    </div>

  </div>

  <div class="footer">
    COMUNIDAD PRIVADA · ARX
  </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- TU CONFIGURACIÓN -->
<script src="./arx-config.js"></script>


<script>
(function () {

  "use strict";

  const message = document.getElementById("message");
  const codeMessage = document.getElementById("codeMessage");
  const emailInput = document.getElementById("email");
  const sendButton = document.getElementById("sendButton");
  const codeBox = document.getElementById("codeBox");
  const codeInput = document.getElementById("memberCode");
  const codeButton = document.getElementById("codeButton");

  let supabaseClient = null;

  function showMessage(text, type) {
    message.className = "message " + (type || "");
    message.textContent = text;
  }

  function showCodeMessage(text, type) {
    codeMessage.className = "message " + (type || "");
    codeMessage.textContent = text;
  }

  /*
   * Comprobamos que Supabase exista
   */
  function initSupabase() {

    try {

      if (!window.supabase) {
        throw new Error("No se ha cargado Supabase.");
      }

      if (!window.ARX_SUPABASE_URL) {
        throw new Error("Falta ARX_SUPABASE_URL.");
      }

      if (!window.ARX_SUPABASE_KEY) {
        throw new Error("Falta ARX_SUPABASE_KEY.");
      }

      supabaseClient = window.supabase.createClient(
        window.ARX_SUPABASE_URL,
        window.ARX_SUPABASE_KEY
      );

      return true;

    } catch (error) {

      console.error("ARX Supabase:", error);

      showMessage(
        "ARX no puede conectarse con el servidor. Revisa arx-config.js.",
        "error"
      );

      sendButton.disabled = true;

      return false;
    }
  }


  /*
   * ENVÍO DEL ENLACE
   */
  async function sendMagicLink() {

    const email = emailInput.value.trim();

    if (!email) {
      showMessage("Escribe tu email.", "error");
      emailInput.focus();
      return;
    }

    if (!email.includes("@")) {
      showMessage("Introduce un email válido.", "error");
      emailInput.focus();
      return;
    }

    if (!supabaseClient) {
      showMessage(
        "ARX todavía no está conectado con Supabase.",
        "error"
      );
      return;
    }

    sendButton.disabled = true;

    sendButton.innerHTML =
      '<span class="loading"></span>Enviando...';

    showMessage("", "");

    try {

      const redirectUrl =
        window.location.origin +
        window.location.pathname;

      const { data, error } =
        await supabaseClient.auth.signInWithOtp({

          email: email,

          options: {
            emailRedirectTo: redirectUrl,
            shouldCreateUser: true
          }

        });

      if (error) {
        throw error;
      }

      showMessage(
        "✓ Enlace enviado. Revisa tu correo y pulsa el enlace para entrar en ARX.",
        "success"
      );

      codeBox.classList.add("visible");

      sendButton.innerHTML = "Enlace enviado ✓";

      setTimeout(function () {
        sendButton.disabled = false;
        sendButton.innerHTML = "Enviarme el enlace";
      }, 5000);

    } catch (error) {

      console.error("Error enviando enlace:", error);

      let text = "No se pudo enviar el enlace.";

      if (error && error.message) {
        text += " " + error.message;
      }

      showMessage(text, "error");

      sendButton.disabled = false;
      sendButton.innerHTML = "Enviarme el enlace";
    }
  }


  /*
   * CÓDIGO ARX
   */
  function checkCode() {

    const code =
      codeInput.value.trim().toUpperCase();

    if (!code) {
      showCodeMessage(
        "Introduce tu código ARX.",
        "error"
      );
      return;
    }

    /*
     * Código de miembro
     */
    if (code === "ARX-MEMBER-1702") {

      showCodeMessage(
        "✓ Código correcto. Bienvenida a ARX.",
        "success"
      );

      localStorage.setItem(
        "ARX_MEMBER_AUTHORIZED",
        "true"
      );

      setTimeout(function () {
        window.location.href = "./comunidad.html";
      }, 700);

      return;
    }

    /*
     * Código de fundadora
     */
    if (code === "ARX-FUNDADORA") {

      showCodeMessage(
        "✓ Código de fundadora reconocido.",
        "success"
      );

      localStorage.setItem(
        "ARX_FOUNDER_AUTHORIZED",
        "true"
      );

      setTimeout(function () {
        window.location.href = "./comunidad.html";
      }, 700);

      return;
    }

    showCodeMessage(
      "Código ARX incorrecto.",
      "error"
    );
  }


  /*
   * BOTONES
   */

  sendButton.addEventListener(
    "click",
    sendMagicLink
  );

  codeButton.addEventListener(
    "click",
    checkCode
  );


  /*
   * ENTER EN EL EMAIL
   */

  emailInput.addEventListener(
    "keydown",
    function (event) {

      if (event.key === "Enter") {
        event.preventDefault();
        sendMagicLink();
      }

    }
  );


  /*
   * ENTER EN EL CÓDIGO
   */

  codeInput.addEventListener(
    "keydown",
    function (event) {

      if (event.key === "Enter") {
        event.preventDefault();
        checkCode();
      }

    }
  );


  /*
   * COMPROBAR SESIÓN DESPUÉS DE PULSAR
   * EL ENLACE DEL CORREO
   */

  async function checkExistingSession() {

    if (!supabaseClient) return;

    try {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (session) {

        console.log(
          "ARX: sesión iniciada",
          session.user.email
        );

        codeBox.classList.add("visible");

        showMessage(
          "✓ Email verificado. Introduce tu código ARX para continuar.",
          "success"
        );
      }

    } catch (error) {

      console.error(
        "Error comprobando sesión:",
        error
      );

    }
  }


  /*
   * INICIO
   */

  if (initSupabase()) {
    checkExistingSession();
  }

})();
</script>

</body>
</html>
